# Alternative to scripts/qdrant_up.sh for people who prefer Compose.
# Works with `docker compose up -d` or `podman-compose up -d`.
# Version is pinned deliberately — see the comment in scripts/qdrant_up.sh.
services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: vector-taste-qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      # Qdrant images ship no curl/wget, so probe the port from bash instead.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The web UI. Optional: `docker compose up -d qdrant` still starts only the database.
  app:
    build: .
    container_name: vector-taste-app
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
    environment:
      # Overrides the host-side URL in .env; inside the network Qdrant is always on 6333.
      QDRANT_URL: http://qdrant:6333
      HF_HOME: /hf
    volumes:
      - ./audio:/app/audio:ro
      - ./raw:/app/raw:ro
      - ./data:/app/data
      - ./generated:/app/generated
      # Reuse the CLAP weights already downloaded on the host instead of fetching 1.4 GB again.
      - ${HF_HOME:-~/.cache/huggingface}:/hf
    restart: unless-stopped
